<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAGUMS – Announcements</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset + Base ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --black:#0a0a0f; --deep:#0f0f1a; --surface:#13131f; --card:#16162a;
  --border:#252540; --border2:#2e2e50;
  --purple:#7c3aed; --purp2:#9d5bff; --accent:#c084fc;
  --text:#e8e6ff; --muted:#7b7a9d; --dim:#4a4a6a;
  --green:#34d399; --amber:#f59e0b; --red:#f87171; --blue:#60a5fa;
}
body {
  font-family:'DM Sans', sans-serif;
  background:var(--black); color:var(--text);
  min-height:100vh; min-height:100dvh;
}

/* ── Topbar ── */
.topbar {
  position:sticky; top:0; z-index:50;
  background:var(--deep); border-bottom:1px solid var(--border);
  padding:0 20px; height:58px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.topbar-left  { display:flex; align-items:center; gap:10px; }
.topbar-right { display:flex; align-items:center; gap:8px; }
.topbar-title { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; color:#fff; }

.back-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:10px;
  font-size:13px; font-weight:600; font-family:'DM Sans',sans-serif;
  color:var(--muted); border:1px solid var(--border2);
  background:transparent; cursor:pointer; text-decoration:none;
  transition:all .2s; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.back-btn:hover { border-color:var(--purple); color:var(--text); background:rgba(124,58,237,.08); }

.logout-link {
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; font-weight:500; color:var(--muted); cursor:pointer;
  padding:7px 14px; border-radius:9px; border:1px solid var(--border);
  background:none; font-family:'DM Sans',sans-serif;
  transition:all .2s; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.logout-link:hover { color:var(--red); border-color:rgba(248,113,113,.3); background:rgba(248,113,113,.06); }

/* ── Page wrapper ── */
.page {
  max-width:780px; margin:0 auto;
  padding:32px 20px 60px;
}

/* ── Page header ── */
.page-header {
  margin-bottom:24px;
}
.page-header h1 {
  font-family:'Syne',sans-serif; font-size:22px; font-weight:800; color:#fff;
  margin-bottom:4px;
}
.page-header p { font-size:13px; color:var(--muted); }

/* ── Filter + search bar ── */
.controls {
  display:flex; align-items:center; gap:8px;
  flex-wrap:wrap; margin-bottom:20px;
}
.filter-btn {
  padding:6px 16px; border-radius:100px;
  font-size:12px; font-weight:600; font-family:'DM Sans',sans-serif;
  border:1px solid var(--border2); background:transparent; color:var(--muted);
  cursor:pointer; transition:all .18s;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.filter-btn:hover { border-color:var(--purple); color:var(--text); }
.filter-btn.active          { background:rgba(124,58,237,.18); border-color:var(--purple); color:var(--accent); }
.filter-btn.f-high.active   { background:rgba(248,113,113,.15); border-color:var(--red);   color:var(--red); }
.filter-btn.f-medium.active { background:rgba(245,158,11,.15);  border-color:var(--amber); color:var(--amber); }
.filter-btn.f-low.active    { background:rgba(52,211,153,.15);  border-color:var(--green); color:var(--green); }

.search-wrap { flex:1; min-width:160px; max-width:280px; position:relative; }
.search-wrap input {
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:100px; padding:7px 16px 7px 36px;
  font-family:'DM Sans',sans-serif; font-size:13px; color:var(--text);
  outline:none; transition:border-color .2s; -webkit-appearance:none;
}
.search-wrap input:focus { border-color:var(--purple); }
.search-wrap input::placeholder { color:var(--dim); }
.search-icon {
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-size:13px; color:var(--dim); pointer-events:none;
}

/* ── Announcement cards ── */
.ann-list { display:flex; flex-direction:column; gap:12px; min-height:200px; }

.ann-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; overflow:hidden;
  transition:border-color .2s, transform .18s;
  animation:cardIn .3s cubic-bezier(.16,1,.3,1) both;
  margin-bottom:14px;
}
@keyframes cardIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.ann-card:hover { border-color:var(--border2); transform:translateY(-2px); }
/* Priority left-border accent */
.ann-card.p-high   { border-left:4px solid var(--red); }
.ann-card.p-medium { border-left:4px solid var(--amber); }
.ann-card.p-low    { border-left:4px solid var(--green); }
.ann-card.archived { opacity:.55; }

.ann-inner { padding:18px 20px; }

.ann-top {
  display:flex; align-items:flex-start;
  justify-content:space-between; gap:12px; margin-bottom:8px;
}
.ann-title-text {
  font-family:'Syne',sans-serif; font-size:14px; font-weight:700;
  color:#fff; line-height:1.35; flex:1; min-width:0;
}
.badges { display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
.pri-badge {
  font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px;
  text-transform:uppercase; letter-spacing:.04em;
}
.pri-badge.high   { background:rgba(248,113,113,.15); color:var(--red); }
.pri-badge.medium { background:rgba(245,158,11,.15);  color:var(--amber); }
.pri-badge.low    { background:rgba(52,211,153,.15);  color:var(--green); }
.arc-badge {
  font-size:10px; font-weight:600; padding:3px 9px; border-radius:100px;
  background:rgba(107,114,128,.15); color:#9ca3af;
}

.ann-body-text {
  font-size:13px; color:var(--muted); line-height:1.65;
  margin-bottom:14px;
}

.ann-footer {
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:10px;
}
.ann-meta { font-size:11px; color:var(--dim); line-height:1.6; }
.ann-meta b { color:var(--muted); font-weight:500; }

/* ── Vote buttons ── */
.vote-row { display:flex; gap:6px; }
.vote-btn {
  display:inline-flex; align-items:center; gap:4px;
  padding:4px 12px; border-radius:100px;
  font-size:12px; font-weight:600; font-family:'DM Sans',sans-serif;
  border:1px solid var(--border2); background:transparent; color:var(--muted);
  cursor:pointer; transition:all .18s;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.vote-btn:active { transform:scale(.96); }
.vote-btn.up:hover   { border-color:var(--green); color:var(--green); background:rgba(52,211,153,.1); }
.vote-btn.down:hover { border-color:var(--red);   color:var(--red);   background:rgba(248,113,113,.1); }
.vote-btn.voted-up   { border-color:var(--green); color:var(--green); background:rgba(52,211,153,.12); }
.vote-btn.voted-down { border-color:var(--red);   color:var(--red);   background:rgba(248,113,113,.12); }
.vote-btn:disabled   { opacity:.5; cursor:not-allowed; }

/* ── Pagination ── */
.pagination {
  display:flex; align-items:center; justify-content:space-between;
  margin-top:28px; gap:12px; flex-wrap:wrap;
}
.page-info { font-size:13px; color:var(--muted); white-space:nowrap; }
.page-info b { color:var(--text); }
.page-btns { display:flex; gap:8px; }
.page-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 18px; border-radius:10px;
  font-size:13px; font-weight:600; font-family:'DM Sans',sans-serif;
  border:1px solid var(--border2); background:transparent; color:var(--muted);
  cursor:pointer; transition:all .2s;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.page-btn:hover:not(:disabled) { border-color:var(--purple); color:var(--text); background:rgba(124,58,237,.08); }
.page-btn:disabled { opacity:.35; cursor:not-allowed; }
.page-btn.primary {
  background:linear-gradient(135deg,var(--purple),var(--purp2));
  border-color:transparent; color:#fff;
  box-shadow:0 4px 14px rgba(124,58,237,.28);
}
.page-btn.primary:hover:not(:disabled) { box-shadow:0 6px 20px rgba(124,58,237,.4); transform:translateY(-1px); }

/* ── Admin action buttons — inline next to priority badge ── */
.btn-act{font-size:10px;padding:3px 9px;border-radius:6px;border:1px solid;background:transparent;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;font-weight:600;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.btn-act.edit{border-color:rgba(96,165,250,.35);color:var(--blue);}
.btn-act.edit:hover{background:rgba(96,165,250,.12);}
.btn-act.del{border-color:rgba(248,113,113,.35);color:var(--red);}
.btn-act.del:hover{background:rgba(248,113,113,.12);}

/* ── Edit modal ── */
.modal-backdrop{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:26px;width:100%;max-width:520px;position:relative;max-height:90vh;overflow-y:auto;animation:modalIn .3s cubic-bezier(.16,1,.3,1);}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-close{position:absolute;top:14px;right:16px;background:transparent;border:none;font-size:20px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.modal-close:hover{color:var(--text);}
.modal-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#fff;margin-bottom:18px;}
.ef{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.ef label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.ef input,.ef textarea,.ef select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;-webkit-appearance:none;resize:none;}
.ef input:focus,.ef textarea:focus,.ef select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.12);}
.ef select option{background:var(--surface);}
.e-alert{display:none;padding:9px 13px;border-radius:9px;font-size:12px;margin-bottom:12px;line-height:1.5;}
.e-alert.show{display:block;}
.e-alert.error  {background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--red);}
.e-alert.success{background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.3); color:var(--green);}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.btn-modal-ok{flex:1;background:linear-gradient(135deg,var(--purple),var(--purp2));border:none;border-radius:10px;padding:12px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#fff;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;}
.btn-modal-ok:hover:not(:disabled){transform:translateY(-1px);}
.btn-modal-ok:disabled{opacity:.6;cursor:not-allowed;}
.btn-modal-cancel{background:transparent;border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;}

/* ── Confirm modal ── */
.confirm-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px;}
.confirm-modal.open{display:flex;}
.empty-state { padding:56px 20px; text-align:center; }
.empty-icon  { font-size:46px; margin-bottom:14px; }
.empty-state h3 { font-family:'Syne',sans-serif; font-size:17px; color:var(--text); margin-bottom:6px; }
.empty-state p  { font-size:13px; color:var(--muted); }

.skeleton {
  background:linear-gradient(90deg,var(--surface) 25%,var(--card) 50%,var(--surface) 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:10px;
}
@keyframes shimmer { from{background-position:200% 0} to{background-position:-200% 0} }
.skel-card { height:110px; margin-bottom:12px; border-radius:14px; }

/* ── Responsive ── */
@media (max-width:500px) {
  .page { padding:20px 14px 60px; }
  .topbar { padding:0 14px; }
  .ann-top { flex-direction:column; gap:6px; }
  .page-btn span { display:none; } /* hide label on tiny screens, keep arrow */
}
</style>
</head>
<body>

<!-- Topbar — no sidebar -->
<div class="topbar">
  <div class="topbar-left">
    <a id="back-btn" href="#" class="back-btn">← Back</a>
    <div class="topbar-title">📢 Announcements</div>
  </div>
  <div class="topbar-right">
    <button class="logout-link" onclick="logout()">🚪 Sign Out</button>
  </div>
</div>

<!-- Main content -->
<div class="page">

  <div class="page-header">
    <h1>Announcement History</h1>
    <p id="page-desc">Loading…</p>
  </div>

  <!-- Filter + search -->
  <div class="controls">
    <button class="filter-btn active"   id="f-all"    onclick="setFilter('all')">All</button>
    <button class="filter-btn f-high"   id="f-high"   onclick="setFilter('high')">🔴 Important</button>
    <button class="filter-btn f-medium" id="f-medium" onclick="setFilter('medium')">🟡 Medium</button>
    <button class="filter-btn f-low"    id="f-low"    onclick="setFilter('low')">🟢 General</button>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="ann-search" placeholder="Search announcements…" oninput="onSearch()">
    </div>
  </div>

  <!-- Announcement list -->
  <div id="ann-list">
    <!-- Skeletons while loading -->
    <div class="skel-card skeleton"></div>
    <div class="skel-card skeleton" style="animation-delay:.1s"></div>
    <div class="skel-card skeleton" style="animation-delay:.2s"></div>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination" style="display:none;">
    <div class="page-info" id="page-info">—</div>
    <div class="page-btns">
      <button class="page-btn" id="btn-prev" onclick="goPage(-1)" disabled>
        ← <span>Previous</span>
      </button>
      <button class="page-btn primary" id="btn-next" onclick="goPage(1)" disabled>
        <span>Next</span> →
      </button>
    </div>
  </div>

</div><!-- /page -->

<!-- Edit Announcement Modal -->
<div class="modal-backdrop" id="edit-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeEditModal()">✕</button>
    <div class="modal-title">✏️ Edit Announcement</div>
    <div class="e-alert" id="edit-alert"></div>
    <div class="ef"><label>Title</label><input type="text" id="edit-title" placeholder="Announcement title"></div>
    <div class="ef"><label>Message</label><textarea id="edit-msg" rows="4" placeholder="Announcement message…"></textarea></div>
    <div class="ef"><label>Priority</label>
      <select id="edit-priority">
        <option value="low">🟢 General — low priority</option>
        <option value="medium">🟡 Medium — important</option>
        <option value="high">🔴 Important — urgent</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeEditModal()">Cancel</button>
      <button class="btn-modal-ok" id="edit-save-btn" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="confirm-modal" id="confirm-modal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-title" id="confirm-title">Confirm</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:18px;" id="confirm-msg">Are you sure?</div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-modal-ok" id="confirm-ok" style="background:linear-gradient(135deg,#dc2626,#f87171)">Confirm</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//  Auth + role routing
// ════════════════════════════════════════════════
const _token = localStorage.getItem('yagums_token');
const _user  = JSON.parse(localStorage.getItem('yagums_user') || 'null');
if (!_token || !_user) { window.location.href = 'login.html'; }

const DASHBOARDS = {
  'Admin':             'dashboard-admin.html',
  'Facility Manager':  'dashboard-facility.html',
  'Maintenance Staff': 'dashboard-maintenance.html',
  'Lecturer':          'dashboard-lecturer.html',
  'Student':           'dashboard-student.html',
};
const homeDash = DASHBOARDS[_user.role] || 'dashboard-student.html';
document.getElementById('back-btn').href = homeDash;

// Only Admin and Facility Manager can edit/delete/archive
const isManager = ['Admin','Facility Manager'].includes(_user.role);

// ════════════════════════════════════════════════
//  State
// ════════════════════════════════════════════════
const PER_PAGE    = 6;
let allData       = [];   // full unfiltered list from API
let filtered      = [];   // after filter + search applied
let currentPage   = 1;
let activeFilter  = 'all';

// ════════════════════════════════════════════════
//  API
// ════════════════════════════════════════════════
async function apiGet(url) {
  try {
    const r = await fetch(url, { headers:{ 'Authorization':'Bearer '+_token } });
    return await r.json();
  } catch { return { success:false }; }
}
async function apiPost(url, body) {
  try {
    const r = await fetch(url, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+_token},
      body:JSON.stringify(body)
    });
    return await r.json();
  } catch { return { success:false }; }
}

// ════════════════════════════════════════════════
//  Load announcements
// ════════════════════════════════════════════════
async function loadAnnouncements() {
  try {
    // api/announcements.php?history=1 — open to ALL roles, returns full history
    const data = await apiGet('api/announcements.php?history=1');
    if (!data.success) {
      showEmpty('Could not load announcements. Make sure the server is running.');
      return;
    }
    allData = data.announcements || [];
    applyFilter();
  } catch {
    showEmpty('Could not connect to server.');
  }
}

// ════════════════════════════════════════════════
//  Filter + search
// ════════════════════════════════════════════════
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-'+f).classList.add('active');
  currentPage = 1;
  applyFilter();
}

function onSearch() {
  currentPage = 1;
  applyFilter();
}

function applyFilter() {
  const q = (document.getElementById('ann-search').value || '').toLowerCase().trim();

  filtered = allData;

  // Priority filter
  if (activeFilter !== 'all') {
    filtered = filtered.filter(a => a.priority === activeFilter);
  }

  // Search filter
  if (q) {
    filtered = filtered.filter(a =>
      (a.title  || '').toLowerCase().includes(q) ||
      (a.message|| '').toLowerCase().includes(q) ||
      (a.posted_by_name||'').toLowerCase().includes(q)
    );
  }

  // Update description
  const total = filtered.length;
  const pages = Math.ceil(total / PER_PAGE) || 1;
  document.getElementById('page-desc').textContent =
    total === 0
      ? 'No announcements found'
      : total + ' announcement' + (total !== 1 ? 's' : '') +
        ' · Page ' + currentPage + ' of ' + pages;

  render();
}

// ════════════════════════════════════════════════
//  Render current page
// ════════════════════════════════════════════════
function render() {
  const total   = filtered.length;
  const pages   = Math.ceil(total / PER_PAGE) || 1;
  const start   = (currentPage - 1) * PER_PAGE;
  const pageItems = filtered.slice(start, start + PER_PAGE);

  const listEl = document.getElementById('ann-list');
  const pagEl  = document.getElementById('pagination');

  if (!total) {
    showEmpty(
      activeFilter !== 'all' || document.getElementById('ann-search').value
        ? 'No announcements match your filter.'
        : 'No announcements have been posted yet.'
    );
    pagEl.style.display = 'none';
    return;
  }

  // Render cards
  listEl.innerHTML = pageItems.map((a, idx) => {
    const uv    = a.user_vote || null;
    const isArc = !a.is_active;
    return `
      <div class="ann-card p-${a.priority}${isArc?' archived':''}"
           id="ac-${a.announcement_id}"
           style="animation-delay:${idx*0.04}s">
        <div class="ann-inner">
          <div class="ann-top">
            <div class="ann-title-text">${esc(a.title)}</div>
            <div class="badges">
              ${isManager ? `
                <button class="btn-act edit" onclick="openEditModal(${a.announcement_id})">✏️ Edit</button>
                <button class="btn-act del"  onclick="deleteAnn(${a.announcement_id},'${esc(a.title)}')">🗑️ Delete</button>
              ` : ''}
              <span class="pri-badge ${a.priority}">${labelFor(a.priority)}</span>
              ${isArc ? '<span class="arc-badge">Archived</span>' : ''}
            </div>
          </div>
          <div class="ann-body-text">${esc(a.message)}</div>
          <div class="ann-footer">
            <div class="ann-meta">
              📅 ${a.created_at} &nbsp;·&nbsp; <b>By:</b> ${esc(a.posted_by_name || 'Admin')}
            </div>
            <div class="vote-row">
              <button class="vote-btn up ${uv==='up'?'voted-up':''}"
                      id="vup-${a.announcement_id}"
                      onclick="vote(${a.announcement_id},'up')">
                👍 <span id="vc-up-${a.announcement_id}">${a.upvotes||0}</span>
              </button>
              <button class="vote-btn down ${uv==='down'?'voted-down':''}"
                      id="vdn-${a.announcement_id}"
                      onclick="vote(${a.announcement_id},'down')">
                👎 <span id="vc-dn-${a.announcement_id}">${a.downvotes||0}</span>
              </button>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  // Pagination controls
  pagEl.style.display = 'flex';
  const from = start + 1;
  const to   = Math.min(start + PER_PAGE, total);
  document.getElementById('page-info').innerHTML =
    'Showing <b>' + from + '–' + to + '</b> of <b>' + total + '</b>';

  const prevBtn = document.getElementById('btn-prev');
  const nextBtn = document.getElementById('btn-next');
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= pages;

  // Update page-desc
  document.getElementById('page-desc').textContent =
    total + ' announcement' + (total!==1?'s':'') + ' · Page ' + currentPage + ' of ' + pages;
}

function goPage(dir) {
  const pages = Math.ceil(filtered.length / PER_PAGE) || 1;
  currentPage = Math.max(1, Math.min(currentPage + dir, pages));
  render();
  // Scroll to top of list smoothly
  document.getElementById('ann-list').scrollIntoView({ behavior:'smooth', block:'start' });
}

// ════════════════════════════════════════════════
//  Voting — available to all users
// ════════════════════════════════════════════════
async function vote(annId, voteType) {
  const upBtn = document.getElementById('vup-'+annId);
  const dnBtn = document.getElementById('vdn-'+annId);
  if (!upBtn || !dnBtn) return;
  upBtn.disabled = true; dnBtn.disabled = true;

  try {
    const data = await apiPost('api/announcements.php', {
      action:'vote', announcement_id:annId, vote:voteType
    });
    if (!data.success) return;

    document.getElementById('vc-up-'+annId).textContent = data.upvotes;
    document.getElementById('vc-dn-'+annId).textContent = data.downvotes;
    upBtn.className = 'vote-btn up'   + (data.vote==='up'   ? ' voted-up'   : '');
    dnBtn.className = 'vote-btn down' + (data.vote==='down' ? ' voted-down' : '');

    // Update in-memory data so vote state persists through re-renders
    const a = allData.find(x => x.announcement_id == annId);
    if (a) { a.upvotes = data.upvotes; a.downvotes = data.downvotes; a.user_vote = data.vote; }
  } finally {
    upBtn.disabled = false; dnBtn.disabled = false;
  }
}

// ════════════════════════════════════════════════
//  Helpers
// ════════════════════════════════════════════════
function showEmpty(msg) {
  document.getElementById('ann-list').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">📢</div>
      <h3>No Announcements</h3>
      <p>${esc(msg)}</p>
    </div>`;
  document.getElementById('pagination').style.display = 'none';
}

function labelFor(priority) {
  return { high:'Important', medium:'Medium', low:'General' }[priority] || priority;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function logout() {
  localStorage.removeItem('yagums_token');
  localStorage.removeItem('yagums_user');
  document.cookie = 'yagums_token=; path=/; max-age=0';
  window.location.href = 'login.html';
}

// ════════════════════════════════════════════════
//  Edit / Archive / Delete (Admin + FM only)
// ════════════════════════════════════════════════
let _editingId = null;

function openEditModal(id) {
  const a = allData.find(x => x.announcement_id === id);
  if (!a) return;
  _editingId = id;
  document.getElementById('edit-title').value    = a.title    || '';
  document.getElementById('edit-msg').value      = a.message  || '';
  document.getElementById('edit-priority').value = a.priority || 'medium';
  document.getElementById('edit-alert').className = 'e-alert';
  document.getElementById('edit-modal').classList.add('open');
}
function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('open');
  _editingId = null;
}

async function saveEdit() {
  const title    = document.getElementById('edit-title').value.trim();
  const message  = document.getElementById('edit-msg').value.trim();
  const priority = document.getElementById('edit-priority').value;
  const alertEl  = document.getElementById('edit-alert');
  alertEl.className = 'e-alert';
  if (!title)   { alertEl.textContent='✕ Title required.';   alertEl.className='e-alert show error'; return; }
  if (!message) { alertEl.textContent='✕ Message required.'; alertEl.className='e-alert show error'; return; }
  const btn = document.getElementById('edit-save-btn'); btn.disabled=true; btn.textContent='Saving…';
  const data = await apiPost('api/announcements.php', {action:'edit', announcement_id:_editingId, title, message, priority});
  if (!data.success) { alertEl.textContent='✕ '+(data.message||'Failed.'); alertEl.className='e-alert show error'; btn.disabled=false; btn.textContent='Save Changes'; return; }
  alertEl.textContent='✓ Updated!'; alertEl.className='e-alert show success';
  // Update in-memory and re-render
  const a = allData.find(x => x.announcement_id === _editingId);
  if (a) { a.title=title; a.message=message; a.priority=priority; }
  setTimeout(() => { closeEditModal(); applyFilter(); }, 700);
  btn.disabled=false; btn.textContent='Save Changes';
}

function deleteAnn(id, title) {
  showConfirm('🗑️ Delete Announcement', `Permanently delete "${title}"? This cannot be undone.`, 'Delete', async () => {
    const data = await apiPost('api/announcements.php', {action:'delete', announcement_id:id});
    if (data.success) {
      allData = allData.filter(x => x.announcement_id !== id);
      if ((currentPage-1)*PER_PAGE >= filtered.length-1 && currentPage > 1) currentPage--;
      applyFilter();
    }
  }, true);
}

function showConfirm(title, msg, okLabel, onOk, danger=false) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent   = msg;
  const ok = document.getElementById('confirm-ok');
  ok.textContent  = okLabel;
  ok.style.background = danger ? 'linear-gradient(135deg,#dc2626,#f87171)' : 'linear-gradient(135deg,var(--purple),var(--purp2))';
  ok.onclick = () => { closeConfirm(); onOk(); };
  document.getElementById('confirm-modal').classList.add('open');
}
function closeConfirm() { document.getElementById('confirm-modal').classList.remove('open'); }

// ── Init ──────────────────────────────────────────
loadAnnouncements();
</script>
