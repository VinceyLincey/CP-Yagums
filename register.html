<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="4;url=login.html">
<title>YAGUMS – Registration Closed</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --black:#0a0a0f; --purple:#7c3aed; --purp2:#9d5bff; --text:#e8e6ff; --muted:#7b7a9d; --accent:#c084fc; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--black); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#16162a; border:1px solid #252540; border-radius:24px; padding:48px 40px; max-width:480px; width:100%; text-align:center; }
  .icon { font-size:52px; margin-bottom:20px; }
  h1 { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; color:#fff; margin-bottom:10px; }
  p { font-size:15px; color:var(--muted); line-height:1.7; margin-bottom:24px; }
  a { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,var(--purple),var(--purp2)); color:#fff; text-decoration:none; padding:13px 28px; border-radius:12px; font-family:'Syne',sans-serif; font-weight:700; font-size:14px; box-shadow:0 4px 18px rgba(124,58,237,.35); transition:all .2s; }
  a:hover { transform:translateY(-1px); box-shadow:0 8px 26px rgba(124,58,237,.45); }
  .note { font-size:12px; color:#4a4a6a; margin-top:20px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <h1>Registration Closed</h1>
  <p>Self-registration is no longer available. Accounts are created by the university administrator. Please contact your admin to receive your login credentials.</p>
  <a href="login.html">← Go to Login</a>
  <p class="note">Redirecting automatically in 4 seconds…</p>
</div>
</body>
</html>
